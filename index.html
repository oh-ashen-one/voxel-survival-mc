.hotbar-slot{background:rgba(90,90,90,0.7);border-color:#2c2c2c #777 #777 #2c2c2c;}.hotbar-slot.active{

.slot canvas{width:32px;height:32px;image-rendering:pixelated;pointer-events:none;}.slot-count{position:absolute;bottom:2px;right:3px;font-size:9px;

#f3-overlay{position:fixed;top:8px;left:8px;z-index:22;pointer-events:none;font-size:9px;line-height:1.65;color:#e8e8e8;display:none;}

.recipe-btn.craftable{border-color:#1f8f1f;background:#bfe8bf;}#cursor-item{position:fixed;width:40px;height:40px;pointer-events:none;

.furnace-layout{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0;}
.furnace-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.flame-box{width:28px;height:28px;background:#555;position:relative;border:1px solid #333;}
.flame-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,#ff5500,#ffcc00);height:0%;}
.prog-box{width:48px;height:16px;background:#555;position:relative;border:1px solid #333;}.prog-fill{height:100%;background:#fff;width:0%;}#toast-msg{
